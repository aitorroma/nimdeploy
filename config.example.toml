[server]
# Behind a reverse proxy keep it local: "127.0.0.1:9000" or a unix socket.
listen = "127.0.0.1:9000"
#listen = "unix:/run/nimdeploy/nimdeploy.sock"
#socket_mode = "0666"         # who can connect to the socket
# Only if the proxy forwards /nimdeploy/... without stripping the prefix:
#base_path = "/nimdeploy"
# Proxies whose X-Forwarded-For / X-Real-IP are believed (unix socket: always).
#trusted_proxies = ["127.0.0.0/8", "::1"]
# Behind Cloudflare (see README, Cloudflare):
#trusted_proxies = ["127.0.0.0/8", "::1", "cloudflare"]
#client_ip_header = "CF-Connecting-IP"
# max_body_bytes = 26214400   # 25 MB, the GitHub maximum
# shutdown_timeout = "5m"     # wait this long for running deploys on stop
# Bearer token for /status and /deploy (manual deploys, `nimdeploy run`).
# Without it /status is open and manual deploys are disabled.
api_token_env = "NIMDEPLOY_API_TOKEN"

[logging]
directory = "/var/log/nimdeploy"
retain = 30                   # log files kept per deploy (0 = keep all)

# Chat notifications (optional). Formats: slack, discord, telegram, json.
# on = "failure" sends failures and the first success after one (recovery).
#[notify]
#format = "slack"
#on = "failure"               # failure | always | never
#url_env = "NOTIFY_WEBHOOK_URL"
#log_lines = 20               # last log lines included on failure
# Telegram instead of url_env:
#format = "telegram"
#telegram_token_env = "TELEGRAM_BOT_TOKEN"
#telegram_chat_id = "-1001234567890"

# GitHub commit statuses (optional): shows the deploy result next to each
# commit. Fine-grained token with "Commit statuses: Read and write".
#[github]
#token_env = "GITHUB_TOKEN"
#commit_status = false        # e.g. a read-only token used only for wait_for_ci

# Labels for every deploy on this server (optional): shown in notifications,
# /status, /metrics, as DEPLOY_LABEL_* and on the hub. Override per deploy
# with [deploy.<name>.labels].
#[labels]
#client = "Acme"
#environment = "production"

# Send events to a central hub (optional): "nimdeploy hub agent add <name>"
# on the hub prints the token for secrets.env.
#[hub]
#url = "https://hub.example.com"
#agent = "acme-prod-1"         # default: short hostname
#token_env = "NIMDEPLOY_HUB_TOKEN"

[deploy.frontend]
# provider = "github"         # github (default), gitea, forgejo, gitlab, bitbucket
path = "/hooks/frontend"
repository = "acme/frontend"
branch = "main"
secret_env = "FRONTEND_WEBHOOK_SECRET"
working_directory = "/var/www/frontend"
command = "/usr/local/bin/deploy-frontend.sh"
timeout = "20m"

[deploy.agency]
path = "/hooks/agency"
repository = "acme/agency"
branch = "main"
secret_env = "AGENCY_WEBHOOK_SECRET"
working_directory = "/var/www/agency"
command = "/usr/local/bin/deploy-agency.sh"
timeout = "20m"
# Deploy only after these GitHub Actions workflows pass for the pushed commit
# (needs [github] token_env with "Actions: read"). Manual runs don't wait.
#wait_for_ci = ["linter", "tests"]
#ci_timeout = "30m"
lock = true                   # one deploy at a time
queue = true                  # a push during a deploy runs after it (latest push wins);
                              # false = reject it with 409
log_output = true             # write stdout/stderr to the log file

[deploy.backend]
path = "/hooks/backend"
repository = "acme/backend"
branch = "main"
secret_env = "BACKEND_WEBHOOK_SECRET"
working_directory = "/srv/backend"
command = "/bin/bash"
args = ["-c", "set -euxo pipefail; git pull --ff-only; npm ci; npm run build; pm2 reload backend --update-env"]
# systemd's PATH is minimal: add the directory where node/npm/pm2 live
# (e.g. ~/.nvm/versions/node/v22.x/bin). Check with: which pm2
env = ["NODE_ENV=production", "PATH=/usr/local/bin:/usr/bin:/bin"]
timeout = "10m"

# Any JSON webhook (Ansible, CI jobs, scripts): see the docs, "Generic webhooks".
# Declared params are validated and passed to the command as env variables.
#[deploy.services]
#provider = "generic"
#path = "/hooks/services"
#secret_env = "SERVICES_WEBHOOK_SECRET"
#timestamp_header = "X-Timestamp"   # signed timestamp, refuses replays
#queue_key = "SERVICE"              # one lock and queue per service
#command = "/usr/local/bin/deploy-services.sh"
#[deploy.services.when]
#action = "deploy"
#[deploy.services.params]
#SERVICE = { from = "service", enum = ["api", "worker"], required = true }
#VERSION = { from = "release.tag", match = '^v\d+\.\d+\.\d+$', default = "v0.0.0" }

