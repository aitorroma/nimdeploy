name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    services:
      sqld:
        image: ghcr.io/tursodatabase/libsql-server:v0.24.33
        ports: ["8080:8080"]
    env:
      NIMDEPLOY_TEST_LIBSQL: http://127.0.0.1:8080
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test
        run: make test
      - name: Build archives
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME}"
          mkdir -p dist
          for arch in amd64 arm64; do
            name="nimdeploy_${VERSION}_linux_${arch}"
            mkdir -p "dist/$name"
            GOOS=linux GOARCH=$arch CGO_ENABLED=0 go build -trimpath \
              -ldflags="-s -w -X main.version=${VERSION}" -o "dist/$name/nimdeploy" .
            cp -r install.sh config.example.toml deploy README.md LICENSE "dist/$name/"
            tar -C dist -czf "dist/$name.tar.gz" "$name"
            # Bare binary with a fixed name, for releases/latest/download/... one-liners.
            cp "dist/$name/nimdeploy" "dist/nimdeploy_linux_${arch}"
          done
          (cd dist && sha256sum ./*.tar.gz ./nimdeploy_linux_* > checksums.txt)
      - name: Ansible collection
        run: |
          set -euo pipefail
          v="${GITHUB_REF_NAME#v}"
          c=ansible/ansible_collections/aitorroma/nimdeploy
          sed -i "s/^version: .*/version: $v/" "$c/galaxy.yml"
          pipx install ansible-core
          ansible-galaxy collection build "$c" --output-path dist
          (cd dist && sha256sum "aitorroma-nimdeploy-$v.tar.gz" >> checksums.txt)
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/nimdeploy_linux_* dist/checksums.txt --generate-notes --title "$GITHUB_REF_NAME"

  image:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/nimdeploy
          tags: |
            type=semver,pattern=v{{version}}
            type=semver,pattern=v{{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ github.ref_name }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  chart:
    needs: image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Package and push the chart (oci://ghcr.io/<owner>/charts/nimdeploy-hub)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          v="${GITHUB_REF_NAME#v}"
          helm package deploy/helm/nimdeploy-hub --version "$v" --app-version "$GITHUB_REF_NAME" -d dist
          echo "$GH_TOKEN" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm push "dist/nimdeploy-hub-$v.tgz" "oci://ghcr.io/${{ github.repository_owner }}/charts"
