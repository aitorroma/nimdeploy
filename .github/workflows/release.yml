name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test
        run: make test
      - name: Build archives
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME}"
          mkdir -p dist
          for arch in amd64 arm64; do
            name="nimdeploy_${VERSION}_linux_${arch}"
            mkdir -p "dist/$name"
            GOOS=linux GOARCH=$arch CGO_ENABLED=0 go build -trimpath \
              -ldflags="-s -w -X main.version=${VERSION}" -o "dist/$name/nimdeploy" .
            cp -r install.sh config.example.toml deploy README.md LICENSE "dist/$name/"
            tar -C dist -czf "dist/$name.tar.gz" "$name"
            # Bare binary with a fixed name, for releases/latest/download/... one-liners.
            cp "dist/$name/nimdeploy" "dist/nimdeploy_linux_${arch}"
          done
          (cd dist && sha256sum ./*.tar.gz ./nimdeploy_linux_* > checksums.txt)
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/nimdeploy_linux_* dist/checksums.txt --generate-notes --title "$GITHUB_REF_NAME"
