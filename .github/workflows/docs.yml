name: Docs

on:
  push:
    branches: [main]
    paths: ["docs/**", "mkdocs.yml", "get.sh", "deploy/examples/**", ".github/workflows/docs.yml"]
  pull_request:
    paths: ["docs/**", "mkdocs.yml", "get.sh", "deploy/examples/**", ".github/workflows/docs.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # MkDocs 2.0 drops the plugin and theme system Material relies on: stay on 1.x.
      - run: pip install "mkdocs>=1.6,<2" "mkdocs-material>=9.6,<10"
      - run: mkdocs build --strict
      # The one-line installer: https://nimdeploy.nimbox360.com/install.sh
      - run: install -m 644 get.sh site/install.sh
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
