{{- if not .Values.hub.existingSecret }}
{{- $name := include "hub.fullname" . }}
{{- $token := .Values.hub.token }}
{{- if not $token }}
{{- $old := lookup "v1" "Secret" .Release.Namespace $name }}
{{- if $old }}
{{- $token = index $old.data "token" | b64dec }}
{{- else }}
{{- $token = randAlphaNum 40 }}
{{- end }}
{{- end }}
{{- if lt (len $token) 16 }}{{ fail "hub.token must be at least 16 characters" }}{{ end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels: {{- include "hub.labels" . | nindent 4 }}
type: Opaque
data:
  token: {{ $token | b64enc | quote }}
{{- end }}
{{- if and (not .Values.sqld.enabled) .Values.externalDatabase.token (not .Values.externalDatabase.existingSecret) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "hub.fullname" . }}-db
  labels: {{- include "hub.labels" . | nindent 4 }}
type: Opaque
data:
  token: {{ .Values.externalDatabase.token | b64enc | quote }}
{{- end }}
