{{- if and .Values.hub.agentCA.enabled (not (include "hub.tlsSecret" .)) }}
{{- fail "hub.agentCA needs the hub to terminate TLS: set hub.tls.existingSecret or hub.tls.certificate.enabled" }}
{{- end }}
{{- if include "hub.caOnVolume" . }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "hub.fullname" . }}-ca
  labels: {{- include "hub.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep   # agent certificates depend on this CA
spec:
  accessModes: [ReadWriteOnce]
  {{- with .Values.hub.agentCA.persistence.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests: {storage: {{ .Values.hub.agentCA.persistence.size }}}
{{- end }}
{{- if .Values.hub.tls.certificate.enabled }}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "hub.tlsSecret" . }}
  labels: {{- include "hub.labels" . | nindent 4 }}
spec:
  secretName: {{ include "hub.tlsSecret" . }}
  dnsNames: [{{ .Values.ingressRouteTCP.enabled | ternary .Values.ingressRouteTCP.host .Values.ingress.host | quote }}]
  issuerRef: {{- toYaml .Values.hub.tls.certificate.issuerRef | nindent 4 }}
{{- end }}
{{- if .Values.ingressRouteTCP.enabled }}
{{- if not (include "hub.tlsSecret" .) }}
{{- fail "ingressRouteTCP passes TLS through to the hub: set hub.tls.existingSecret or hub.tls.certificate.enabled" }}
{{- end }}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: {{ include "hub.fullname" . }}
  labels: {{- include "hub.labels" . | nindent 4 }}
spec:
  entryPoints: {{- toYaml .Values.ingressRouteTCP.entryPoints | nindent 4 }}
  routes:
    - match: HostSNI(`{{ .Values.ingressRouteTCP.host }}`)
      services:
        - name: {{ include "hub.fullname" . }}
          port: {{ .Values.service.port }}
  tls:
    passthrough: true
{{- end }}
