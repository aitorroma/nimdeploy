{{- if .Values.sqld.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "hub.fullname" . }}-sqld
  labels: {{- include "hub.labels" . | nindent 4 }}
    app.kubernetes.io/component: sqld
spec:
  serviceName: {{ include "hub.fullname" . }}-sqld
  replicas: 1
  selector:
    matchLabels: {{- include "hub.selector" . | nindent 6 }}
      app.kubernetes.io/component: sqld
  template:
    metadata:
      labels: {{- include "hub.selector" . | nindent 8 }}
        app.kubernetes.io/component: sqld
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 666
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: sqld
          image: "{{ .Values.sqld.image.repository }}:{{ .Values.sqld.image.tag }}"
          imagePullPolicy: {{ .Values.sqld.image.pullPolicy }}
          env:
            - {name: SQLD_NODE, value: primary}
            - {name: SQLD_HTTP_LISTEN_ADDR, value: "0.0.0.0:8080"}
          ports:
            - {name: http, containerPort: 8080}
          readinessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 10
          livenessProbe:
            tcpSocket: {port: http}
            periodSeconds: 20
          volumeMounts:
            - {name: data, mountPath: /var/lib/sqld}
          resources: {{- toYaml .Values.sqld.resources | nindent 12 }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        {{- with .Values.sqld.persistence.storageClass }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.sqld.persistence.size }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "hub.fullname" . }}-sqld
  labels: {{- include "hub.labels" . | nindent 4 }}
    app.kubernetes.io/component: sqld
spec:
  selector: {{- include "hub.selector" . | nindent 4 }}
    app.kubernetes.io/component: sqld
  ports:
    - {name: http, port: 8080, targetPort: http}
{{- if .Values.networkPolicy.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "hub.fullname" . }}-sqld
  labels: {{- include "hub.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "hub.selector" . | nindent 6 }}
      app.kubernetes.io/component: sqld
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {{- include "hub.selector" . | nindent 14 }}
              app.kubernetes.io/component: hub
      ports:
        - {port: 8080}
{{- end }}
{{- end }}
